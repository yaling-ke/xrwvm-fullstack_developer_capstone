<html>
<head>
  <!-- Link the style sheet here -->
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/bootstrap.min.css">
</head>
<div>
    <nav class="navbar navbar-expand-lg navbar-light" style="background-color:darkturquoise; height: 1in;">
        <div class="container-fluid">
          <h2 style="padding-right: 5%;">Dealerships</h2>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText" aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarText">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link" style="font-size: larger;" aria-current="page" href="/">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" style="font-size: larger;" href="/about">About Us</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" style="font-size: larger;" href="/contact">Contact Us</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>  

      <main class="wrap">
      <div class="grid">
        <form id="contact-form" action="/contact" method="post" novalidate>
          <div class="row">
            <div>
              <label for="name">Full name</label>
              <input id="name" name="name" type="text" autocomplete="name" required>
            </div>
            <div>
              <label for="email">Email</label>
              <input id="email" name="email" type="email" autocomplete="email" required>
            </div>
          </div>
     
          <div class="row">
            <div>
              <label for="phone">Phone <span class="hint">(optional)</span></label>
              <input id="phone" name="phone" type="tel" autocomplete="tel">
            </div>
            <div>
              <label for="topic">What can we help with?</label>
              <select id="topic" name="topic" required>
                <option value="">Choose one</option>
                <option>Buying a vehicle</option>
                <option>Financing or leasing</option>
                <option>Service or repairs</option>
                <option>Parts</option>
                <option>Something else</option>
              </select>
            </div>
          </div>
     
          <div>
            <label for="vehicle">Vehicle you're interested in <span class="hint">(optional)</span></label>
            <input id="vehicle" name="vehicle" type="text" placeholder="e.g. 2025 Honda CR-V">
          </div>
     
          <div>
            <label for="message">Message</label>
            <textarea id="message" name="message" required></textarea>
          </div>
     
          <fieldset>
            <legend>Best way to reach you</legend>
            <div class="choices">
              <label><input type="radio" name="contact_method" value="email" checked> Email</label>
              <label><input type="radio" name="contact_method" value="phone"> Phone</label>
              <label><input type="radio" name="contact_method" value="text"> Text message</label>
            </div>
          </fieldset>
     
          <button type="submit">Send message</button>
          <p class="status" id="status" role="status" aria-live="polite"></p>
        </form>
    </div>    
</main>

</div>

</html>
